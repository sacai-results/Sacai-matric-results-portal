
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sacai Examination Results Portal</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f3f7;
    color: #222;
}

header {
    background: #101d38;
    color: white;
    text-align: center;
    padding: 28px 15px;
    border-bottom: 5px solid #c9a646;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 8px 0 0;
    color: #e5e5e5;
}

.disclosure {
    background: #fff3cd;
    color: #664d03;
    border: 1px solid #ffecb5;
    padding: 13px;
    text-align: center;
    font-weight: bold;
    margin: 20px auto;
    max-width: 850px;
    border-radius: 5px;
}

.container {
    max-width: 850px;
    margin: 25px auto;
    padding: 25px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h2 {
    color: #101d38;
    margin-top: 0;
}

label {
    display: block;
    margin-top: 18px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
}

button {
    background: #101d38;
    color: white;
    border: none;
    padding: 13px 22px;
    margin-top: 22px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #243b65;
}

#resultsSection {
    display: none;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th {
    background: #101d38;
    color: white;
    padding: 13px;
    text-align: left;
}

td {
    padding: 13px;
    border-bottom: 1px solid #ddd;
}

tr:nth-child(even) {
    background: #f5f6f8;
}

.level {
    font-weight: bold;
    color: #101d38;
}

.summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-top: 25px;
}

.summary-card {
    background: #f1f3f7;
    padding: 18px;
    border-left: 4px solid #c9a646;
    border-radius: 5px;
}

.summary-card h3 {
    margin: 0 0 10px;
    font-size: 14px;
    color: #555;
}

.summary-card p {
    font-size: 23px;
    font-weight: bold;
    margin: 0;
    color: #101d38;
}

.results-disclosure {
    background: #fff3cd;
    color: #664d03;
    border: 1px solid #ffecb5;
    padding: 12px;
    margin-top: 20px;
    text-align: center;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 22px;
    color: #666;
    font-size: 13px;
}

@media print {
    .no-print,
    header {
        display: none !important;
    }

    body {
        background: white;
    }

    .container {
        box-shadow: none;
    }

    #resultsSection {
        display: block !important;
    }

    .results-disclosure {
        display: block !important;
    }
}
</style>
</head>

<body>

<header>
    <h1> Examination Results Portal</h1>
    <p>Candidate Results </p>
</header>

<div class="disclosure">
    
</div>

<div class="container no-print" id="loginSection">
    <h2>Candidate Login</h2>
    <p>Enter your candidate details to access the results.</p>

    <label for="candidate">Candidate Name</label>
    <input type="text" id="candidate" placeholder="Enter candidate name">

    <label for="exam">Examination Number</label>
    <input type="text" id="exam" placeholder="Enter examination number">

    <button onclick="showResults()">Access Results</button>
</div>

<div class="container" id="resultsSection">
    <h2>Candidate Results</h2>

    <p><strong>Candidate:</strong> <span id="displayName"></span></p>
    <p><strong>Examination Number:</strong> <span id="displayExam"></span></p>

    <div class="results-disclosure">
       
    </div>

    <table>
        <thead>
            <tr>
                <th>Subject</th>
                <th>Percentage</th>
                <th>Level</th>
            </tr>
        </thead>
        <tbody id="resultsTable"></tbody>
    </table>

    <div class="summary">
        <div class="summary-card">
            <h3>Average Percentage</h3>
            <p id="average">0%</p>
        </div>

        <div class="summary-card">
            <h3>Distinctions</h3>
            <p id="distinctions">0</p>
        </div>

        <div class="summary-card">
            <h3>Status</h3>
            
        </div>
    </div>

    <div class="no-print">
        <button onclick="window.print()">Print Results</button>
        <button onclick="logout()">Logout</button>
    </div>
</div>

<footer>
     Examination Results Demonstration
</footer>

<script>
const REQUIRED_EXAM_NUMBER = "2268780956463";

const subjects = [
    { name: "English Home Language", percentage: 82, level: 7 },
    { name: "Afrikaans First Additional Language", percentage: 81, level: 7 },
    { name: "Mathematics", percentage: 76, level: 6 },
    { name: "Accounting", percentage: 74, level: 6 },
    { name: "Life Orientation", percentage: 90, level: 7 },
    { name: "Life Sciences", percentage: 84, level: 7 },
    { name: "Physical Sciences", percentage: 73, level: 6 }
];

const distinctionSubjects = [
    "Life Orientation",
    "Life Sciences",
    "Afrikaans First Additional Language",
    "English Home Language"
];

function showResults() {
    const name = document.getElementById("candidate").value.trim();
    const exam = document.getElementById("exam").value.trim();

    if (!name || !exam) {
        alert("Please enter your candidate name and examination number.");
        return;
    }

    if (exam !== REQUIRED_EXAM_NUMBER) {
        alert("Incorrect examination number. Please try again.");
        return;
    }

    document.getElementById("displayName").textContent = name;
    document.getElementById("displayExam").textContent = exam;

    const table = document.getElementById("resultsTable");
    table.innerHTML = "";

    let total = 0;
    let distinctionCount = 0;

    subjects.forEach(subject => {
        total += subject.percentage;

        if (distinctionSubjects.includes(subject.name)) {
            distinctionCount++;
        }

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${subject.name}</td>
            <td>${subject.percentage}%</td>
            <td class="level">${subject.level}</td>
        `;

        table.appendChild(row);
    });

    const average = (total / subjects.length).toFixed(1);

    document.getElementById("average").textContent = average + "%";
    document.getElementById("distinctions").textContent = distinctionCount;
    document.getElementById("status").textContent = "Sample";

    document.getElementById("loginSection").style.display = "none";
    document.getElementById("resultsSection").style.display = "block";
}

function logout() {
    document.getElementById("resultsSection").style.display = "none";
    document.getElementById("loginSection").style.display = "block";
    document.getElementById("candidate").value = "";
    document.getElementById("exam").value = "";
}
</script>

</body>
</html>
